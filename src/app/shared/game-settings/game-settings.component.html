<div class="bg-gray-800 p-6 rounded-lg">
  <h2 class="text-2xl font-semibold text-green-500 mb-4">{{ title }}</h2>
  <div class="grid grid-cols-3 gap-4">
    <div *ngFor="let option of options"
         class="flex justify-center items-center p-4 bg-gray-200 rounded-lg text-center cursor-pointer hover:bg-gray-300 min-h-32 card-background"
         [class.bg-green-300]="selectedOption === option.value"
         [class.active-card]="selectedOption === option.value"
         (click)="selectOption(option.value)"
         [style.backgroundImage]="'url(' + option.backgroundImage + ')'">
      {{ option.backgroundImage ? '' : option.label }}
    </div>
  </div>
</div>
